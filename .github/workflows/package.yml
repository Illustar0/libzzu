name: Package

on:
  workflow_call:
    inputs:
      version:
        description: Crate version to package, without the leading v; empty keeps the version in Cargo.toml
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore build dependencies
        run: dotnet restore build/_build.csproj --locked-mode

      - name: Generate packaging matrix
        id: matrix
        run: dotnet run --project build --no-restore -- Matrix

  package:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@v2
        if: inputs.version != ''
        with:
          tool: cargo-edit

      - name: Set crate versions
        if: inputs.version != ''
        run: cargo set-version --workspace "${{ inputs.version }}"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore build dependencies
        run: dotnet restore build/_build.csproj --locked-mode

      - name: Set up Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH
          "$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_PATH

      - name: Select 32-bit MinGW
        if: matrix.target == 'i686-pc-windows-gnu'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\mingw32\bin'

      - name: Build and package
        id: package
        run: dotnet run --project build --no-restore -- Package --platform "${{ matrix.target }}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: dist/${{ steps.package.outputs.archive }}.tar.gz*
          if-no-files-found: error
          compression-level: 0

  ios:
    needs: [plan, package]
    if: >-
      contains(fromJSON(needs.plan.outputs.matrix).include.*.target, 'aarch64-apple-ios') &&
      contains(fromJSON(needs.plan.outputs.matrix).include.*.target, 'aarch64-apple-ios-sim') &&
      contains(fromJSON(needs.plan.outputs.matrix).include.*.target, 'x86_64-apple-ios')
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore build dependencies
        run: dotnet restore build/_build.csproj --locked-mode

      - uses: actions/download-artifact@v8
        with:
          pattern: libzzu-*-apple-ios*
          path: dist
          merge-multiple: true

      - name: Assemble XCFramework
        id: xcframework
        run: dotnet run --project build --no-restore -- Xcframework

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.xcframework.outputs.archive }}
          path: dist/${{ steps.xcframework.outputs.archive }}.tar.gz*
          if-no-files-found: error
          compression-level: 0
