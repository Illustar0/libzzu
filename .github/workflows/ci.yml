name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore build dependencies
        run: dotnet restore build/_build.csproj --locked-mode

      - name: Check
        run: dotnet run --project build --no-restore -- Check

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      version: ${{ steps.describe.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Map `git describe` output to SemVer build metadata: v0.3.1-5-gabc1234 -> 0.3.1+5.gabc1234.
      - name: Describe build version
        id: describe
        run: |
          if described="$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null)"; then
            sha="${described##*-}"
            rest="${described%-*}"
            distance="${rest##*-}"
            tag="${rest%-*}"
            version="${tag#v}+${distance}.${sha}"
          else
            version="0.0.0+$(git rev-list --count HEAD).g$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: [check, version]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
