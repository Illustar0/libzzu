name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore build dependencies
        run: dotnet restore build/_build.csproj --locked-mode

      - name: Check
        run: dotnet run --project build --no-restore -- Check

  package:
    needs: check
    uses: ./.github/workflows/package.yml
