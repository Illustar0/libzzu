[workspace]
members = ["crates/libzzu", "crates/zzu"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
zzu = { version = "0.0.0", path = "crates/zzu" }
base64 = "0.22"
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
ecb = { version = "0.1", features = ["alloc"] }
encoding_rs = "0.8"
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
icalendar = { version = "0.17", default-features = false }
libsm = "0.6"
pem = "4"
rand = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "json", "query", "form", "charset", "gzip"] }
rsa = "0.9"
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sm4 = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1

[profile.test.package.libsm]
opt-level = 2

[profile.test.package.num-bigint]
opt-level = 2
