[package]
name = "zzu"
version.workspace = true
edition.workspace = true
description = "Async Rust client for Zhengzhou University campus services"
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords = ["sdk", "client", "cas", "university"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["auth", "eas", "ecard", "mail", "network"]
auth = [
    "dep:base64",
    "dep:futures-util",
    "dep:jiff",
    "dep:pem",
    "dep:rand",
    "dep:rsa",
    "dep:tokio",
]
eas = ["auth", "dep:icalendar"]
ecard = [
    "auth",
    "dep:ecb",
    "dep:hex",
    "dep:rust_decimal",
    "dep:scraper",
    "dep:sm2",
    "dep:sm4",
    "schemars?/rust_decimal1",
]
mail = ["auth"]
network = [
    "dep:base64",
    "dep:encoding_rs",
    "dep:jiff",
    "dep:rand",
    "dep:regex",
    "dep:scraper",
    "dep:tokio",
    "tokio/net",
]
schemars = ["dep:schemars", "schemars/url2"]

[dependencies]
base64 = { workspace = true, optional = true }
ecb = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
icalendar = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
pem = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
reqwest.workspace = true
rsa = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
scraper = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sm2 = { workspace = true, optional = true }
sm4 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
